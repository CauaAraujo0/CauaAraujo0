<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Cauã Araújo — developer profile</title>
  <desc id="desc">Dark terminal-style banner introducing Cauã Araújo, an Information Systems student and aspiring software developer.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070C17"/>
      <stop offset="1" stop-color="#101E2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#42E8C0"/>
      <stop offset="1" stop-color="#50BBF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6B8EAB" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="30" y="32" width="1140" height="256" rx="16" fill="#0D1623" fill-opacity=".92" stroke="#355266" stroke-opacity=".85"/>
    <rect x="30" y="32" width="1140" height="38" rx="16" fill="#182637"/>
    <path d="M30 54H1170V70H30Z" fill="#182637"/>
    <circle cx="56" cy="51" r="6" fill="#FD7070"/>
    <circle cx="78" cy="51" r="6" fill="#F7BF60"/>
    <circle cx="100" cy="51" r="6" fill="#53D9AA"/>
    <text x="137" y="56" fill="#8198AD" font-family="Consolas, Menlo, monospace" font-size="13">caua@github: ~/profile</text>
    <text x="68" y="114" fill="#42E8C0" font-family="Consolas, Menlo, monospace" font-size="19">$ whoami</text>
    <text x="68" y="169" fill="#F1F7FB" font-family="'Segoe UI', Arial, sans-serif" font-weight="750" font-size="47" letter-spacing="1">Cauã Araújo</text>
    <rect x="68" y="187" width="370" height="4" rx="2" fill="url(#accent)"/>
    <text x="68" y="225" fill="#C0D3E2" font-family="Consolas, Menlo, monospace" font-size="18">Information Systems Student</text>
    <text x="68" y="258" fill="#8DA9BC" font-family="Consolas, Menlo, monospace" font-size="15">Aspiring Software Developer  /  Brazil</text>
    <path d="M780 100V265" stroke="#2A445B" stroke-width="1"/>
    <text x="815" y="122" fill="#4FD9C5" font-family="Consolas, Menlo, monospace" font-size="15">const developer = {</text>
    <text x="840" y="154" fill="#A9BBD0" font-family="Consolas, Menlo, monospace" font-size="15">focus: <tspan fill="#F3D28C">"learning"</tspan>,</text>
    <text x="840" y="184" fill="#A9BBD0" font-family="Consolas, Menlo, monospace" font-size="15">mindset: <tspan fill="#F3D28C">"curious"</tspan>,</text>
    <text x="840" y="214" fill="#A9BBD0" font-family="Consolas, Menlo, monospace" font-size="15">goal: <tspan fill="#F3D28C">"build &amp; grow"</tspan></text>
    <text x="815" y="244" fill="#4FD9C5" font-family="Consolas, Menlo, monospace" font-size="15">};<tspan fill="#4FD9C5">_</tspan></text>
  </g>
</svg>
